<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playable History</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3b2f2a">
<style>
:root{--bg:#f6efe3;--ink:#2b2420;--accent:#8c3b1f;--card:#fffaf2}
*{box-sizing:border-box}body{margin:0;font:17px/1.55 Georgia,serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:16px}
.bar{height:8px;background:#e2d6c3;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--accent);transition:width .3s}
.art{width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;margin:12px 0;background:#d9c7a8}.art svg,.art img{width:100%;height:100%;display:block;object-fit:cover}
h1{font-size:1.6em;margin:.3em 0}h2{font-size:1.3em;margin:.3em 0}.meta{font-size:.85em;color:#6b5d52}
button,.btn{display:block;width:100%;min-height:48px;margin:10px 0;padding:12px 14px;font:inherit;text-align:left;border:2px solid var(--accent);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
button:focus-visible,.btn:focus-visible{outline:3px solid #1f5f8c;outline-offset:2px}.primary{background:var(--accent);color:#fff;text-align:center}
.fact{background:var(--card);border-left:4px solid var(--accent);padding:10px 12px;margin:12px 0;border-radius:6px}
.tag{display:inline-block;font-size:.75em;background:#ead9bf;padding:2px 8px;border-radius:10px}
footer{font-size:.8em;color:#6b5d52;margin-top:24px}footer a{color:inherit}
.top{display:flex;gap:10px;align-items:center}.top .bar{flex:1}.top button{width:auto;min-height:36px;margin:0;padding:4px 10px;font-size:.85em;text-align:center}
.stop{font-size:.9em}.route li{margin:10px 0}
</style></head><body><main id="app" aria-live="polite"><p>Loading story…</p></main>
<noscript><p style="padding:16px">This story needs JavaScript turned on.</p></noscript>
<script src="engine.js"></script></body></html>
